name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Go for libXray
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Checkout pinned Xray engine
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: v26.11.9
          path: .engine/libXray

      - name: Build libXray Android AAR
        working-directory: .engine/libXray
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          python3 build/main.py android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/app/libs/libXray.aar"

      - name: Download and verify Hev SOCKS5 tunnel AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --silent --show-error \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar \
            --output app/libs/hev-socks5-tunnel.aar
          echo "ae8a2e96b80b4eccccd037805a4bb4a278090c89dbcae8bc6fcb7634e9a255b9  app/libs/hev-socks5-tunnel.aar" | sha256sum --check -

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KupalVPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
